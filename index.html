<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vibe Weather</title>
  <meta name="description" content="Look up current weather for any city.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #0e9aa7;
      --teal-deep: #076b74;
      --coral: #ff6f61;
      --coral-soft: #ffd8d3;
      --gold: #ffc93c;
      --sand: #fff7e8;
      --ink: #1f2a33;
      --muted: #5c6b75;
      --card: #ffffff;
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Poppins", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: linear-gradient(170deg, var(--teal) 0%, var(--teal-deep) 38%, var(--sand) 38.1%);
      background-attachment: fixed;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 28px 16px 48px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    h1 .sun { color: var(--gold); }
    .badge {
      background: var(--gold);
      color: var(--ink);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      align-self: center;
    }
    .tagline {
      color: #e0f6f7;
      margin: -12px 0 20px;
      font-size: 0.95rem;
    }
    form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      font: inherit;
      border: 2px solid transparent;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--gold);
    }
    button {
      padding: 14px 18px;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--coral);
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255,111,97,0.4);
    }
    button:hover { background: #f25a4b; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 10px 30px rgba(7,107,116,0.18);
      margin-bottom: 20px;
    }
    .status { color: var(--muted); text-align: center; }
    .status.error { color: #c0392b; }
    .place { margin: 0; font-size: 1.25rem; font-weight: 600; }
    .place small { color: var(--muted); font-weight: 400; }
    .now {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 12px 0 16px;
    }
    .icon { font-size: 3.2rem; line-height: 1; }
    .temp { font-size: 3.4rem; font-weight: 800; color: var(--coral); line-height: 1; }
    .cond { color: var(--teal-deep); font-weight: 600; }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat {
      background: var(--sand);
      border-left: 4px solid var(--gold);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .stat:last-child { grid-column: 1 / -1; }
    .stat span { display: block; font-size: 0.8rem; color: var(--muted); }
    .stat strong { font-size: 1.15rem; }
    h2 {
      font-size: 1rem;
      margin: 0 0 10px;
      color: var(--teal-deep);
    }
    ul.recent { list-style: none; margin: 0; padding: 0; }
    ul.recent li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px dashed var(--coral-soft);
      cursor: pointer;
    }
    ul.recent li:last-child { border-bottom: 0; }
    ul.recent li:hover .r-city { color: var(--coral); }
    .r-city { font-weight: 600; }
    .r-meta { font-size: 0.8rem; color: var(--muted); }
    .r-temp {
      background: var(--gold);
      border-radius: 999px;
      padding: 2px 10px;
      font-weight: 600;
      white-space: nowrap;
    }
    footer { text-align: center; font-size: 0.75rem; color: var(--muted); }
    footer a { color: var(--teal-deep); }
    [hidden] { display: none !important; }
    @media (min-width: 640px) {
      main { padding-top: 48px; }
      h1 { font-size: 2.5rem; }
      .stats { grid-template-columns: repeat(3, 1fr); }
      .stat:last-child { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Vibe Weather <span class="sun">☀</span></h1>
      <span class="badge">v1</span>
    </header>
    <p class="tagline">Current conditions for any city on Earth.</p>

    <form id="search-form" autocomplete="off">
      <input id="city" type="text" name="city" placeholder="Search a city, e.g. Miami" maxlength="100" required aria-label="City">
      <button id="go" type="submit">Search</button>
    </form>

    <section class="card" id="result" aria-live="polite">
      <p class="status" id="status">Type a city to see the weather.</p>
      <div id="weather" hidden>
        <p class="place"><span id="w-city"></span> <small id="w-region"></small></p>
        <div class="now">
          <div class="icon" id="w-icon"></div>
          <div>
            <div class="temp" id="w-temp"></div>
            <div class="cond" id="w-cond"></div>
          </div>
        </div>
        <div class="stats">
          <div class="stat"><span>Feels like</span><strong id="w-feels"></strong></div>
          <div class="stat"><span>Humidity</span><strong id="w-hum"></strong></div>
          <div class="stat"><span>Wind</span><strong id="w-wind"></strong></div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Recent searches</h2>
      <ul class="recent" id="recent"></ul>
      <p class="status" id="recent-status">Loading…</p>
    </section>

    <footer>Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://ufnfsolctetkdoypxjmj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VsWQ3g6nng6KeLr92NaFtg_cLNDlUiu";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // WMO weather interpretation codes -> [label, emoji]
    const WMO = {
      0: ["Clear sky", "☀️"], 1: ["Mainly clear", "🌤️"], 2: ["Partly cloudy", "⛅"], 3: ["Overcast", "☁️"],
      45: ["Fog", "🌫️"], 48: ["Rime fog", "🌫️"],
      51: ["Light drizzle", "🌦️"], 53: ["Drizzle", "🌦️"], 55: ["Heavy drizzle", "🌧️"],
      56: ["Freezing drizzle", "🌧️"], 57: ["Freezing drizzle", "🌧️"],
      61: ["Light rain", "🌦️"], 63: ["Rain", "🌧️"], 65: ["Heavy rain", "🌧️"],
      66: ["Freezing rain", "🌧️"], 67: ["Freezing rain", "🌧️"],
      71: ["Light snow", "🌨️"], 73: ["Snow", "🌨️"], 75: ["Heavy snow", "❄️"], 77: ["Snow grains", "🌨️"],
      80: ["Rain showers", "🌦️"], 81: ["Rain showers", "🌧️"], 82: ["Violent showers", "⛈️"],
      85: ["Snow showers", "🌨️"], 86: ["Snow showers", "❄️"],
      95: ["Thunderstorm", "⛈️"], 96: ["Thunderstorm, hail", "⛈️"], 99: ["Thunderstorm, hail", "⛈️"]
    };

    const $ = (id) => document.getElementById(id);
    const form = $("search-form"), input = $("city"), btn = $("go");
    const statusEl = $("status"), weatherEl = $("weather");

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.classList.toggle("error", isError);
      statusEl.hidden = false;
      weatherEl.hidden = true;
    }

    async function geocode(name) {
      const url = "https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&format=json&name=" + encodeURIComponent(name);
      const res = await fetch(url);
      if (!res.ok) throw new Error("Geocoding service unavailable.");
      const data = await res.json();
      if (!data.results || !data.results.length) return null;
      return data.results[0];
    }

    async function forecast(lat, lon) {
      const params = new URLSearchParams({
        latitude: lat, longitude: lon,
        current: "temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m",
        temperature_unit: "fahrenheit", wind_speed_unit: "mph", timezone: "auto"
      });
      const res = await fetch("https://api.open-meteo.com/v1/forecast?" + params);
      if (!res.ok) throw new Error("Forecast service unavailable.");
      return (await res.json()).current;
    }

    async function search(name) {
      name = name.trim();
      if (!name) return;
      btn.disabled = true;
      setStatus("Looking up " + name + "…");
      try {
        const place = await geocode(name);
        if (!place) { setStatus("No city found for “" + name + "”.", true); return; }
        const cur = await forecast(place.latitude, place.longitude);
        const [label, icon] = WMO[cur.weather_code] || ["Unknown", "🌡️"];
        const temp = Math.round(cur.temperature_2m * 10) / 10;

        $("w-city").textContent = place.name;
        $("w-region").textContent = [place.admin1, place.country].filter(Boolean).join(", ");
        $("w-icon").textContent = icon;
        $("w-temp").textContent = Math.round(temp) + "°F";
        $("w-cond").textContent = label;
        $("w-feels").textContent = Math.round(cur.apparent_temperature) + "°F";
        $("w-hum").textContent = cur.relative_humidity_2m + "%";
        $("w-wind").textContent = Math.round(cur.wind_speed_10m) + " mph";
        statusEl.hidden = true;
        weatherEl.hidden = false;

        await saveSearch({
          city: place.name.slice(0, 100),
          country: place.country ? place.country.slice(0, 100) : null,
          temperature_f: temp,
          conditions: label.slice(0, 100)
        });
      } catch (err) {
        setStatus(err.message || "Something went wrong.", true);
      } finally {
        btn.disabled = false;
      }
    }

    async function saveSearch(row) {
      const { error } = await db.from("weather_searches").insert(row);
      if (error) console.error("Could not save search:", error.message);
      await loadRecent();
    }

    function timeAgo(iso) {
      const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
      if (s < 60) return "just now";
      if (s < 3600) return Math.floor(s / 60) + " min ago";
      if (s < 86400) return Math.floor(s / 3600) + " hr ago";
      return Math.floor(s / 86400) + " d ago";
    }

    async function loadRecent() {
      const list = $("recent"), st = $("recent-status");
      const { data, error } = await db
        .from("weather_searches")
        .select("city, country, temperature_f, conditions, created_at")
        .order("created_at", { ascending: false })
        .limit(5);
      list.replaceChildren();
      if (error) { st.textContent = "Couldn't load recent searches."; st.hidden = false; return; }
      if (!data.length) { st.textContent = "No searches yet. Be the first!"; st.hidden = false; return; }
      st.hidden = true;
      for (const r of data) {
        const li = document.createElement("li");
        const left = document.createElement("div");
        const city = document.createElement("div");
        city.className = "r-city";
        city.textContent = r.city + (r.country ? ", " + r.country : "");
        const meta = document.createElement("div");
        meta.className = "r-meta";
        meta.textContent = (r.conditions || "") + " · " + timeAgo(r.created_at);
        left.append(city, meta);
        const t = document.createElement("span");
        t.className = "r-temp";
        t.textContent = r.temperature_f != null ? Math.round(r.temperature_f) + "°F" : "–";
        li.append(left, t);
        li.addEventListener("click", () => { input.value = r.city; search(r.city); });
        list.append(li);
      }
    }

    form.addEventListener("submit", (e) => { e.preventDefault(); search(input.value); });
    loadRecent();
  </script>
</body>
</html>
